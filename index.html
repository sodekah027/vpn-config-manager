        document.getElementById("vmessLink").textContent = configs.vmess;
        document.getElementById("vlessLink").textContent = configs.vless;
        document.getElementById("trojanLink").textContent = configs.trojan;

        function fallbackCopy(text) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand("copy");
            document.body.removeChild(ta);
            return ok;
        }

        function copyConfig(type) {
            var config = configs[type];
            var status = document.getElementById("copyStatus");

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(config).then(function() {
                    showCopied(type, status);
                }).catch(function() {
                    if (fallbackCopy(config)) {
                        showCopied(type, status);
                    } else {
                        status.innerHTML = "❌ Clipboard Failed";
                    }
                });
            } else {
                if (fallbackCopy(config)) {
                    showCopied(type, status);
                } else {
                    status.innerHTML = "❌ Clipboard Failed";
                }
            }

            setTimeout(function() {
                status.innerHTML = "";
            }, 1800);
        }

        function showCopied(type, status) {
            status.innerHTML = "✅ " + type.toUpperCase() + " Copied";
            var toast = document.getElementById("toast");
            if (toast) {
                toast.innerHTML = "✅ " + type.toUpperCase() + " Copied";
                toast.classList.remove("opacity-0");
                setTimeout(function() {
                    toast.classList.add("opacity-0");
                }, 1800);
            }
        }
    </script>

    <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 font-medium">
